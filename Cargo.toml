[package]
name = "glomancy-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Glomancy"]
license = "MIT"
description = "Transport-neutral protocol types and validation contracts for safe AI-to-editor integrations."
repository = "https://github.com/charman-07/glomancy-protocol"
readme = "README.md"
keywords = ["ai", "protocol", "json-schema", "developer-tools", "unreal-engine"]
categories = ["development-tools"]
publish = false
include = [
    "src/**",
    "examples/*.rs",
    "README.md",
    "LICENSE",
    "schemas/v1/**",
    "registry/v1/**",
    "compatibility/v1/**",
    "compatibility/snapshots/**",
    "capabilities/v1/**",
    "vectors/v1/**",
    "errors/v1/**",
    "security/v1/**",
    "limits/v1/**",
    "support/v1/**",
    "contracts/v1/**",
    "conformance/v1/**",
    "examples/v1/**",
]

[workspace]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = "deny"
pedantic = "allow"
nursery = "allow"
