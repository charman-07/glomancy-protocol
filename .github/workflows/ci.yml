name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.85
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.85.0

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      - name: Examples
        run: |
          cargo run --example quick_start
          cargo run --example reference_consumer

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install conformance validator
        run: python3 -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Check public/private boundary
        run: python3 scripts/check_public_boundary.py

      - name: Validate JSON, registry hashes, fixtures, and versions
        run: python3 scripts/validate_repository.py

      - name: Validate Rust/JSON registry parity
        run: python3 scripts/validate_rust_registry.py

      - name: Validate Rust/JSON wire enum parity
        run: python3 scripts/validate_wire_enums.py

      - name: Validate protocol error code catalog
        run: python3 scripts/validate_error_catalog.py

      - name: Validate release support policy
        run: python3 scripts/validate_support_policy.py

      - name: Validate public contract fingerprint
        run: python3 scripts/public_contract_fingerprint.py --check

      - name: Validate release-facing metadata
        run: python3 scripts/release_readiness_report.py --json

      - name: Validate capability negotiation profile
        run: python3 scripts/validate_capability_profile.py

      - name: Validate language-neutral consumer vectors
        run: python3 scripts/validate_consumer_vectors.py

      - name: Run independent Python consumer example
        run: python3 examples/consumers/python/reference_consumer.py

      - name: Run independent JavaScript consumer example
        run: node examples/consumers/javascript/reference_consumer.mjs

      - name: Validate published compatibility snapshots
        run: python3 scripts/validate_compatibility_snapshots.py

      - name: Execute JSON Schema conformance fixtures
        run: python3 scripts/validate_fixtures.py

      - name: Smoke-test public conformance CLI
        shell: bash
        run: |
          python3 scripts/glomancy_conformance.py list-schemas
          python3 scripts/glomancy_conformance.py validate examples/v1/valid/task.submit.json
          python3 scripts/glomancy_conformance.py fixtures

          set +e
          python3 scripts/glomancy_conformance.py validate examples/v1/invalid/bad-message-id-format.json
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 2 ]; then
            echo "expected invalid payload exit code 2, got $exit_code" >&2
            exit 1
          fi

          set +e
          python3 scripts/glomancy_conformance.py validate examples/v1/valid/task.submit.json --kind heartbeat
          mismatch_code=$?
          set -e
          if [ "$mismatch_code" -ne 3 ]; then
            echo "expected schema/kind mismatch exit code 3, got $mismatch_code" >&2
            exit 1
          fi

      - name: Smoke-test conformance CLI JSON output
        shell: bash
        run: |
          schema_json="$(python3 scripts/glomancy_conformance.py list-schemas --json)"
          printf '%s\n' "$schema_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["output_version"] == "1.0.0"; assert d["command"] == "list-schemas"; assert d["ok"] is True; assert d["exit_code"] == 0; assert d["schema_count"] == len(d["schemas"]); assert d["schema_count"] > 0'

          valid_json="$(python3 scripts/glomancy_conformance.py validate examples/v1/valid/task.submit.json --json)"
          printf '%s\n' "$valid_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["command"] == "validate"; assert d["ok"] is True; assert d["valid"] is True; assert d["exit_code"] == 0; assert d["kind"] == "task.submit"; assert d["errors"] == []'

          fixture_json="$(python3 scripts/glomancy_conformance.py fixtures --json)"
          printf '%s\n' "$fixture_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["command"] == "fixtures"; assert d["ok"] is True; assert d["passed"] is True; assert d["total_fixtures"] == d["valid_fixtures_accepted"] + d["invalid_fixtures_rejected"]'

          set +e
          invalid_json="$(python3 scripts/glomancy_conformance.py validate examples/v1/invalid/bad-message-id-format.json --json)"
          invalid_code=$?
          set -e
          if [ "$invalid_code" -ne 2 ]; then
            echo "expected invalid JSON-mode payload exit code 2, got $invalid_code" >&2
            exit 1
          fi
          printf '%s\n' "$invalid_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["command"] == "validate"; assert d["ok"] is False; assert d["valid"] is False; assert d["exit_code"] == 2; assert d["error_count"] >= 1; assert len(d["errors"]) >= 1'

      - name: Validate conformance CLI JSON output contract
        run: python3 scripts/validate_cli_output_contract.py

  portability:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Set Rust override
        run: rustup override set 1.85.0

      - name: Tests
        run: cargo test --all-targets
