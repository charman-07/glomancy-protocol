name: Context conformance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-contracts:
    name: Context contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install conformance requirements
        run: python3 -m pip install --disable-pip-version-check -r requirements-conformance.txt

      - name: Validate context policy output contract
        run: python3 scripts/validate_context_policy_contract.py

      - name: Validate context snapshot output contract
        run: python3 scripts/validate_context_snapshot_contract.py

      - name: Validate task verification output contract
        run: python3 scripts/validate_task_verification_contract.py

      - name: Smoke-test context policy CLI
        run: >-
          python3 scripts/glomancy_context_policy.py
          transcripts/v1/accepted/approval-gated-success-with-evidence.json
          --forbid-source web
          --json

      - name: Smoke-test context snapshot descriptor
        run: >-
          python3 scripts/glomancy_context_snapshot.py
          validate
          context/v1/examples/context-snapshot.json
          --json

      - name: Smoke-test task verification profile
        run: >-
          python3 scripts/glomancy_task_verification.py
          verification/v1/examples/strict-read-back.json
          transcripts/v1/accepted/approval-gated-success-with-evidence.json
          --json
